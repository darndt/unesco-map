<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UNESCO World Heritage Map</title>
  <meta name="description" content="Interactive map of all UNESCO World Heritage Sites — cultural, natural and mixed.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="app.css?v=21">
</head>
<body>
  <div id="map" aria-label="Map of World Heritage Sites"></div>

  <aside class="panel" id="panel">
    <div class="panel__top">
    <header class="panel__head">
      <h1>UNESCO World Heritage</h1>
      <p class="panel__sub"><span id="count-visible">—</span> sites</p>
    </header>

    <div class="search">
      <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.2 4.2-1.4 1.4-4.2-4.2A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
      <input id="search" type="search" placeholder="Search a site or country…" autocomplete="off"
             role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list">
      <ul id="results" class="search__results" role="listbox" hidden></ul>
    </div>

    <fieldset class="filters">
      <legend class="sr-only">Site types</legend>
      <label class="chip" data-cat="Cultural">
        <input type="checkbox" value="Cultural" checked><span class="dot dot--cultural"></span>Cultural<span class="chip__n" data-n="Cultural"></span>
      </label>
      <label class="chip" data-cat="Natural">
        <input type="checkbox" value="Natural" checked><span class="dot dot--natural"></span>Natural<span class="chip__n" data-n="Natural"></span>
      </label>
      <label class="chip" data-cat="Mixed">
        <input type="checkbox" value="Mixed" checked><span class="dot dot--mixed"></span>Mixed<span class="chip__n" data-n="Mixed"></span>
      </label>
    </fieldset>

    <label class="toggle">
      <input type="checkbox" id="danger-only">
      <span class="toggle__track"><span class="toggle__thumb"></span></span>
      <span class="toggle__label"><span class="dot dot--danger"></span>Only sites in danger<span class="chip__n" data-n="danger"></span></span>
    </label>
    </div>

    <section class="info" id="info" hidden aria-label="Site details">
      <button class="close-btn" type="button" aria-label="Close" data-close>&times;</button>
      <div class="info__body" data-body></div>
    </section>
  </aside>

  <section class="sheet" id="sheet" hidden aria-label="Site details">
    <button class="close-btn" type="button" aria-label="Close" data-close>&times;</button>
    <div class="sheet__body" data-body></div>
  </section>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="app.js?v=21"></script>
</body>
</html>
